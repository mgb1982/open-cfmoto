name = "ridescreen-telemetry"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Deployed by .github/workflows/telemetry.yml
workers_dev = true

# Weekly summary to Telegram (Mondays 07:00 UTC = 08:00/09:00 in Barcelona) + 180-day cleanup;
# hourly: delete live-location links a day after they end.
[triggers]
crons = ["0 7 * * 1", "17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ridescreen-telemetry"
# Filled in by .github/workflows/telemetry.yml (creates the database on the first deploy).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
