name: Build APK
on:
  workflow_dispatch:
  push:
    # Pushing a branch release/zontes-N (or a tag zontes-N) publishes a public GitHub Release
    # tagged zontes-N with the APK attached; the tag is created GitHub-side.
    branches: [main, 'test/**', 'feature/**', 'release/**']
    tags: ['zontes-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission
        run: chmod +x gradlew

      # Same signing key on every build, so a new APK installs over the old one (settings kept)
      # instead of "app not installed" + uninstall. The key lives in the DEBUG_KEYSTORE_B64 repo
      # secret (base64 JKS, alias androiddebugkey, passwords "android" — what the debugRelease
      # signingConfig and the debug build both read from ~/.android/debug.keystore).
      - name: Version suffix
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/*) S="-zontes${GITHUB_REF_NAME#release/zontes-}" ;;
            refs/tags/zontes-*)   S="-zontes${GITHUB_REF_NAME#zontes-}" ;;
            *)                    S="-dev" ;;
          esac
          echo "VERSION_SUFFIX=$S" >> "$GITHUB_ENV"
          echo "versionName suffix: $S"
      - name: Install fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep 'SHA256:' | head -1
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set — this APK gets a random key and won't install over the previous one"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype JKS -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionSuffix="$VERSION_SUFFIX"
      - name: Build release APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleRelease -PversionSuffix="$VERSION_SUFFIX" > release-build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # Annotations are readable through the API even when raw logs are not.
            grep -E "What went wrong|rror:|Lint found|^e: " release-build.log | grep -v "^\s*at " | head -6 \
              | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            grep -vE '^(w: |- To |See https|\s*$)' release-build.log | tail -n 40 | cut -c1-220 | paste -sd '~' \
              | tail -c 3600 | fold -w 900 | while IFS= read -r l; do echo "::error::TAIL ${l}"; done
          fi
          exit $rc
      - name: Unit tests (fork features)
        run: ./gradlew testDebugUnitTest --tests 'dev.zanderp.opencfmoto.SpeedVolumeCurveTest' --tests 'dev.zanderp.opencfmoto.ClockLabTest' --tests 'dev.zanderp.opencfmoto.UpdateCheckerForkTest'
      - name: Show signing certificate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256' | head -1 || true
          WAPK=$(find wear/build/outputs/apk/release -name '*.apk' | head -1)
          echo "wear: $WAPK"
          "$BT/apksigner" verify --print-certs "$WAPK" | grep -i 'SHA-256' | head -1 || true
      - name: Prepare release APK
        id: rel
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "dist/OpenCfMoto-Zontes-$TAG.apk"
          # Optional Wear OS companion (install on the watch, not the phone).
          W="$(find wear/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$W" ] && cp "$W" "dist/OpenCfMoto-Zontes-$TAG-RELOJ-WearOS.apk"
      - name: Create release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenCfMoto para Zontes · ${{ steps.rel.outputs.tag }}
          body_path: .github/release-notes.md
          files: dist/*.apk
          prerelease: false
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-${{ github.ref_name == 'main' && 'main' || 'test' }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-WearOS-${{ github.ref_name == 'main' && 'main' || 'test' }}-${{ github.run_number }}
          path: wear/build/outputs/apk/release/*.apk
