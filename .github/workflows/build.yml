name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**', 'feature/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Unit tests (fork features)
        run: ./gradlew testDebugUnitTest --tests 'dev.zanderp.opencfmoto.SpeedVolumeCurveTest'
      - uses: actions/upload-artifact@v4
        with:
          name: opencfmoto-${{ github.ref_name == 'main' && 'main' || 'test' }}-${{ github.run_number }}
          path: '**/*-debug.apk'
          
