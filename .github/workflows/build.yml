name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**', 'feature/**']
    # Pushing a tag like zontes-1 publishes a public GitHub Release with the APK attached.
    tags: ['zontes-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission
        run: chmod +x gradlew

      # Same signing key on every build, so a new APK installs over the old one (settings kept)
      # instead of "app not installed" + uninstall. The key lives in the DEBUG_KEYSTORE_B64 repo
      # secret (base64 JKS, alias androiddebugkey, passwords "android" — what the debugRelease
      # signingConfig and the debug build both read from ~/.android/debug.keystore).
      - name: Install fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep 'SHA256:' | head -1
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set — this APK gets a random key and won't install over the previous one"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype JKS -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Build release APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleRelease > release-build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # Annotations are readable through the API even when raw logs are not.
            grep -E "What went wrong|rror:|Lint found|^e: " release-build.log | grep -v "^\s*at " | head -6 \
              | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            grep -vE '^(w: |- To |See https|\s*$)' release-build.log | tail -n 40 | cut -c1-220 | paste -sd '~' \
              | tail -c 3600 | fold -w 900 | while IFS= read -r l; do echo "::error::TAIL ${l}"; done
          fi
          exit $rc
      - name: Unit tests (fork features)
        run: ./gradlew testDebugUnitTest --tests 'dev.zanderp.opencfmoto.SpeedVolumeCurveTest' --tests 'dev.zanderp.opencfmoto.ClockLabTest'
      - name: Show signing certificate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256' | head -1 || true
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "dist/OpenCfMoto-Zontes-${GITHUB_REF_NAME}.apk"
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenCfMoto para Zontes · ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.apk
          prerelease: true
      - uses: actions/upload-artifact@v4
        with:
          name: opencfmoto-${{ github.ref_name == 'main' && 'main' || 'test' }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
