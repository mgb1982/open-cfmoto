name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**', 'feature/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission
        run: chmod +x gradlew

      # Same signing key on every build, so a new APK installs over the old one (settings kept)
      # instead of "app not installed" + uninstall. The key lives in the DEBUG_KEYSTORE_B64 repo
      # secret (base64 JKS, alias androiddebugkey, passwords "android" — what the debugRelease
      # signingConfig and the debug build both read from ~/.android/debug.keystore).
      - name: Install fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep 'SHA256:' | head -1
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set — this APK gets a random key and won't install over the previous one"
          fi

      # Debug first: if no secret was set it creates ~/.android/debug.keystore for the release build.
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee release-build.log
      - name: Surface release build errors
        if: failure()
        shell: bash
        run: |
          grep -nE "What went wrong|Error:|error:|Lint found|FAILED|\.xml:[0-9]+|\.kt:[0-9]+" release-build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          sed -n '/What went wrong/,+25p' release-build.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          f=$(ls app/build/reports/lint-results-*.txt 2>/dev/null | head -1)
          if [ -n "$f" ]; then head -60 "$f" | grep -E "Error|error" | head -20 | while IFS= read -r l; do echo "::error::LINT ${l:0:900}"; done; fi
      - name: Unit tests (fork features)
        run: ./gradlew testDebugUnitTest --tests 'dev.zanderp.opencfmoto.SpeedVolumeCurveTest' --tests 'dev.zanderp.opencfmoto.ClockLabTest'
      - name: Show signing certificate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256' | head -1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: opencfmoto-${{ github.ref_name == 'main' && 'main' || 'test' }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
